[project]
name = "agents-and-agents"
version = "0.1.0"
description = "AGENTS and AGENTS — Multi-tenant RAG platform"
requires-python = ">=3.12,<3.14"

dependencies = [
    "fastapi==0.118.0",
    "uvicorn[standard]==0.37.0",
    "pydantic==2.11.9",
    "pydantic-settings==2.11.0",
    "sqlalchemy[asyncio]==2.0.43",
    "asyncpg==0.30.0",
    "httpx==0.28.1",
    "structlog==25.4.0",
    "cryptography==46.0.1",
    # multipart upload parsing for the documents endpoint
    "python-multipart==0.0.20",
    # document parsing. pymupdf also renders the page rasters that OCR needs
    "pymupdf==1.26.4",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "beautifulsoup4==4.14.2",
    # the crawl engine: headless-browser page reads, deep-crawl site discovery
    # and LLM-ready markdown, no API key. its browser binary is a deploy step:
    #   ./.venv/bin/playwright install chromium
    "crawl4ai==0.9.3",
]

[project.optional-dependencies]
# tracing is optional at runtime: the telemetry adapter falls back to structured
# logs when the package or the keys are absent
observability = [
    "langfuse==3.6.2",
]
# MCP stdio wrapper (mcp/server.py) — not needed to run the API itself
mcp = [
    "mcp>=1.0",
]
dev = [
    "ruff==0.13.2",
    "mypy==1.18.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
# inline HTML and CSS in Python strings run past the line limit by nature
"app/api/public.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["crawl4ai.*"]
ignore_missing_imports = true

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
